<!DOCTYPE html>
<html>

<head>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
	<title>Youssef Mroue — Portfolio</title>
	<link rel="stylesheet" href="./style.css">
</head>

<body>
	<canvas class="threejs"></canvas>
	<script type="module" src="./index.js"></script>
	<div class="overlay"></div>
	<div class="firefly-field" id="fireflyField"></div>
	<div class="loading-screen">
		<div class="boot-log" id="terminalBody">
			<div class="boot-log-cursor" id="terminalCursor">▊</div>
		</div>
		<div class="path-progress">
			<div class="path-progress-bar">
				<div class="path-progress-fill" id="loadingBarFill"></div>
			</div>
			<span class="path-progress-percent"><span id="progressPercentage">0</span>%</span>
		</div>
	</div>
	<button class="start">
		<span class="start-label">ENTER</span>
		<span class="start-sub">it's not a resume. it's a world.</span>
	</button>

	<div class="controls-overlay" id="controlsOverlay">
		<div class="controls-content">
			<span class="hud-corner hud-tl"></span>
			<span class="hud-corner hud-tr"></span>
			<span class="hud-corner hud-bl"></span>
			<span class="hud-corner hud-br"></span>
			<p class="controls-title">PLAYER CONTROLS</p>
			<div class="controls-keyboard">
				<div class="key-row"><div class="key-cap key-w">W</div></div>
				<div class="key-row">
					<div class="key-cap">A</div>
					<div class="key-cap">S</div>
					<div class="key-cap">D</div>
				</div>
			</div>
			<p class="controls-label">Move around the world</p>
			<div class="controls-divider"></div>
			<div class="controls-portal-hint">
				<span class="portal-dot"></span>
				<span>Walk into glowing portals to unlock content</span>
			</div>
			<p class="controls-dismiss">&gt; CLICK ANYWHERE TO START</p>
		</div>
	</div>

	<div id="myModal" class="modal">
		<button class="modal-close-btn" id="modalClose">✕ CLOSE</button>
		<div class="modal-inner">
			<div class="modal-hero">
				<p class="modal-hero-label" id="modalHeroLabel"></p>
				<h1 class="modal-hero-title" id="modalTitle"></h1>
				<div class="modal-tags" id="modalTags"></div>
			</div>
			<div class="modal-rule"></div>
			<div class="modal-body" id="modalDescription"></div>
		</div>
	</div>

</body>

</html>
