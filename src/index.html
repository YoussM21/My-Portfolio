<!DOCTYPE html>
<html>

<head>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
	<title>Youssef Mroue — Portfolio</title>
	<link rel="stylesheet" href="./style.css">
</head>

<body>
	<canvas class="threejs"></canvas>
	<script type="module" src="./index.js"></script>
	<div class="overlay"></div>
	<div class="firefly-field" id="fireflyField"></div>
	<div class="loading-screen">
		<div class="boot-log" id="terminalBody">
			<div class="boot-log-cursor" id="terminalCursor">▊</div>
		</div>
		<div class="path-progress">
			<div class="path-progress-bar">
				<div class="path-progress-fill" id="loadingBarFill"></div>
			</div>
			<span class="path-progress-percent"><span id="progressPercentage">0</span>%</span>
		</div>
	</div>
	<button class="start">
		<span class="start-label">ENTER</span>
		<span class="start-sub">it's not a resume. it's a world.</span>
	</button>

	<div class="controls-overlay" id="controlsOverlay">
		<div class="controls-content">
			<div class="controls-keyboard">
				<div class="key-row">
					<div class="key-cap" style="--key-delay: 0s;">W</div>
				</div>
				<div class="key-row">
					<div class="key-cap" style="--key-delay: 0.6s;">A</div>
					<div class="key-cap" style="--key-delay: 1.2s;">S</div>
					<div class="key-cap" style="--key-delay: 1.8s;">D</div>
				</div>
			</div>
			<p class="controls-label">walk into the lights</p>
			<p class="controls-dismiss">press any key to begin</p>
			<span class="control-mote" style="--mx: -140px; --my: -90px;  animation-delay: 0s, 0.2s;"></span>
			<span class="control-mote" style="--mx:  160px; --my: -110px; animation-delay: 1s, 0.8s;"></span>
			<span class="control-mote" style="--mx: -180px; --my:  40px;  animation-delay: 2s, 1.4s;"></span>
			<span class="control-mote" style="--mx:  180px; --my:  60px;  animation-delay: 0.5s, 0.5s;"></span>
			<span class="control-mote" style="--mx:  -90px; --my:  130px; animation-delay: 1.5s, 1.1s;"></span>
			<span class="control-mote" style="--mx:  110px; --my:  140px; animation-delay: 2.5s, 0.3s;"></span>
			<span class="control-mote" style="--mx:  -30px; --my: -170px; animation-delay: 0.8s, 1.7s;"></span>
			<span class="control-mote" style="--mx:   40px; --my:  200px; animation-delay: 1.8s, 0.6s;"></span>
		</div>
	</div>

	<div id="myModal" class="modal">
		<button class="modal-close-btn" id="modalClose">✕ CLOSE</button>
		<div class="modal-inner">
			<div class="modal-hero">
				<p class="modal-hero-label" id="modalHeroLabel"></p>
				<h1 class="modal-hero-title" id="modalTitle"></h1>
				<div class="modal-tags" id="modalTags"></div>
			</div>
			<div class="modal-rule"></div>
			<div class="modal-body" id="modalDescription"></div>
		</div>
	</div>

</body>

</html>
