<!DOCTYPE html>
<html>

<head>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
	<title>Youssef Mroue — Portfolio</title>
	<link rel="stylesheet" href="./style.css">
</head>

<body>
	<canvas class="threejs"></canvas>
	<script type="module" src="./index.js"></script>
	<div class="overlay"></div>
	<div class="loading-screen">
		<div class="terminal-window">
			<div class="terminal-topbar">
				<div class="terminal-dots">
					<span class="td-red"></span>
					<span class="td-yellow"></span>
					<span class="td-green"></span>
				</div>
				<span class="terminal-title-bar">YOUSSEF.EXE</span>
			</div>
			<div class="terminal-body" id="terminalBody">
				<div class="terminal-cursor" id="terminalCursor">▊</div>
			</div>
			<div class="terminal-footer">
				<div class="loading-bar-track">
					<div class="loading-bar-fill" id="loadingBarFill"></div>
				</div>
				<p class="loading-percent"><span id="progressPercentage">0</span>%</p>
			</div>
		</div>
	</div>
	<button class="start">
		<span class="start-label">[ ENTER WORLD ]</span>
		<span class="start-sub">it's not a resume. it's a world.</span>
	</button>

	<div class="controls-overlay" id="controlsOverlay">
		<div class="controls-content">
			<span class="hud-corner hud-tl"></span>
			<span class="hud-corner hud-tr"></span>
			<span class="hud-corner hud-bl"></span>
			<span class="hud-corner hud-br"></span>
			<p class="controls-title">PLAYER CONTROLS</p>
			<div class="controls-keyboard">
				<div class="key-row"><div class="key-cap key-w">W</div></div>
				<div class="key-row">
					<div class="key-cap">A</div>
					<div class="key-cap">S</div>
					<div class="key-cap">D</div>
				</div>
			</div>
			<p class="controls-label">Move around the world</p>
			<div class="controls-divider"></div>
			<div class="controls-portal-hint">
				<span class="portal-dot"></span>
				<span>Walk into glowing portals to unlock content</span>
			</div>
			<p class="controls-dismiss">&gt; CLICK ANYWHERE TO START</p>
		</div>
	</div>

	<div id="myModal" class="modal">
		<div class="modal-wrapper">
			<div class="modal-content">
				<div id="modalTitle"></div>
				<div id="modalDescription"></div>
			</div>
			<button class="close">✕ Close</button>
		</div>
	</div>

</body>

</html>
